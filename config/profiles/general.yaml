agents:
  atomizer:
    llm:
      provider: openai
      model: gpt-4
      temperature: 0.7
      max_tokens: 4096
    prediction_strategy: ChainOfThought
    toolkits: []
    agent_config: {}

  planner:
    llm:
      provider: openai
      model: gpt-4
      temperature: 0.7
      max_tokens: 8192
    prediction_strategy: ChainOfThought
    toolkits: []
    agent_config: {}

  executor:
    llm:
      provider: openai
      model: gpt-4
      temperature: 0.0
      max_tokens: 8192
    prediction_strategy: ReAct
    toolkits:
      - artifact
      - file
      - calculator
    agent_config: {}

  aggregator:
    llm:
      provider: openai
      model: gpt-4
      temperature: 0.7
      max_tokens: 8192
    prediction_strategy: ChainOfThought
    toolkits: []
    agent_config: {}

  verifier:
    llm:
      provider: openai
      model: gpt-4
      temperature: 0.3
      max_tokens: 4096
    prediction_strategy: ChainOfThought
    toolkits: []
    agent_config: {}

runtime:
  max_depth: 6
  timeout: 120
  verbose: true
  max_concurrent_tasks: 4

resilience:
  retry:
    enabled: true
    strategy: Exponential
    max_attempts: 3
    base_delay_ms: 1000
    max_delay_ms: 10000

  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout_ms: 60000

  checkpoint:
    enabled: true
    storage_path: /tmp/roma/checkpoints
    max_checkpoints: 10
    interval_seconds: 300

storage:
  base_path: /tmp/roma
  postgres:
    enabled: false
    connection_url: ""
    pool_size: 10

observability:
  tracing:
    enabled: true
    endpoint: null
    service_name: roma

  event_traces:
    enabled: true
    track_module_events: true

logging:
  level: info
  console_format: Detailed
  rotation_size_mb: 500
